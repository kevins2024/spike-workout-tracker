<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Workout Tracker</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --bg: #f5f5f2;
        --card: #ffffff;
        --border: #e0ddd6;
        --text: #1a1a18;
        --muted: #888780;
        --accent: #2563eb;
        --accent-bg: #eff6ff;
        --green: #16a34a;
        --green-bg: #dcfce7;
        --yellow: #ca8a04;
        --yellow-bg: #fef9c3;
        --red: #dc2626;
        --red-bg: #fee2e2;
        --radius: 10px;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        padding: 0 0 80px;
      }

      header {
        background: var(--card);
        border-bottom: 1px solid var(--border);
        padding: 16px 20px 12px;
        position: sticky;
        top: 0;
        z-index: 10;
      }
      header h1 {
        font-size: 18px;
        font-weight: 600;
      }
      header p {
        font-size: 13px;
        color: var(--muted);
        margin-top: 2px;
      }

      .week-nav {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 12px 16px;
        background: var(--card);
        border-bottom: 1px solid var(--border);
      }
      .week-arrow {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: 1px solid var(--border);
        background: var(--bg);
        font-size: 18px;
        color: var(--text);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .week-arrow:disabled {
        opacity: 0.35;
        cursor: default;
      }
      .week-info {
        text-align: center;
      }
      .week-title {
        font-size: 15px;
        font-weight: 600;
      }
      .week-select {
        margin-top: 3px;
        font-size: 12px;
        color: var(--muted);
        border: none;
        background: transparent;
        text-align: center;
      }

      .content {
        padding: 16px;
        max-width: 600px;
        margin: 0 auto;
      }

      .phase-header {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 14px 16px;
        margin-bottom: 12px;
      }
      .phase-header h2 {
        font-size: 16px;
        font-weight: 600;
      }
      .phase-header p {
        font-size: 13px;
        color: var(--muted);
        margin-top: 3px;
      }
      .phase-note {
        font-size: 13px;
        color: #1e40af;
        background: var(--accent-bg);
        border-radius: 6px;
        padding: 8px 10px;
        margin-top: 10px;
        line-height: 1.5;
      }

      .day-section {
        margin-bottom: 12px;
      }

      .day-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius) var(--radius) 0 0;
        padding: 12px 14px;
        cursor: pointer;
        user-select: none;
      }
      .day-header.collapsed {
        border-radius: var(--radius);
      }

      .day-title {
        font-size: 15px;
        font-weight: 600;
      }
      .optional-tag {
        font-size: 10px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--muted);
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 1px 7px;
        margin-left: 6px;
      }

      .day-status {
        font-size: 11px;
        font-weight: 500;
        padding: 3px 9px;
        border-radius: 20px;
        white-space: nowrap;
      }
      .status-done {
        background: var(--green-bg);
        color: var(--green);
      }
      .status-partial {
        background: var(--yellow-bg);
        color: var(--yellow);
      }
      .status-pending {
        background: var(--bg);
        color: var(--muted);
        border: 1px solid var(--border);
      }

      .day-body {
        background: var(--card);
        border: 1px solid var(--border);
        border-top: none;
        border-radius: 0 0 var(--radius) var(--radius);
        padding: 0 14px 14px;
      }
      .day-body.hidden {
        display: none;
      }

      .rest-day {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 12px 14px;
        font-size: 13px;
        color: var(--muted);
        font-style: italic;
      }

      .exercise-row {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        padding: 10px 0;
        border-bottom: 1px solid var(--border);
      }
      .exercise-row:last-of-type {
        border-bottom: none;
      }

      .exercise-text {
        flex: 1;
        font-size: 14px;
        line-height: 1.4;
        padding-top: 2px;
      }
      .exercise-sub {
        font-size: 12px;
        color: var(--muted);
        margin-top: 2px;
      }

      .status-btns {
        display: flex;
        gap: 5px;
        flex-shrink: 0;
      }

      .status-btn {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        border: 2px solid var(--border);
        background: transparent;
        cursor: pointer;
        font-size: 15px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.1s;
      }
      .status-btn:active {
        transform: scale(0.9);
      }
      .status-btn.selected-green {
        background: var(--green-bg);
        border-color: var(--green);
      }
      .status-btn.selected-yellow {
        background: var(--yellow-bg);
        border-color: var(--yellow);
      }
      .status-btn.selected-red {
        background: var(--red-bg);
        border-color: var(--red);
      }

      .finish-section {
        margin-top: 16px;
        padding-top: 14px;
        border-top: 1px solid var(--border);
      }

      .finish-btn {
        width: 100%;
        padding: 12px;
        background: var(--accent);
        color: #fff;
        border: none;
        border-radius: var(--radius);
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }
      .finish-btn:disabled {
        background: var(--border);
        color: var(--muted);
        cursor: default;
      }
      .finish-btn:not(:disabled):active {
        opacity: 0.85;
      }

      .notes-area {
        width: 100%;
        margin-top: 10px;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        font-size: 14px;
        font-family: inherit;
        resize: vertical;
        min-height: 80px;
        background: var(--bg);
        color: var(--text);
      }

      .save-notes-btn {
        margin-top: 8px;
        padding: 8px 16px;
        border: 1px solid var(--accent);
        background: transparent;
        color: var(--accent);
        border-radius: var(--radius);
        font-size: 14px;
        cursor: pointer;
      }
      .save-notes-btn:active {
        background: var(--accent-bg);
      }

      .completion-msg {
        font-size: 13px;
        color: var(--green);
        margin-top: 8px;
        font-weight: 500;
        display: none;
      }
      .completion-msg.visible {
        display: block;
      }

      .progress-bar-wrap {
        margin-top: 8px;
      }
      .progress-bar {
        height: 5px;
        background: var(--border);
        border-radius: 3px;
        overflow: hidden;
        margin-top: 6px;
      }
      .progress-fill {
        height: 100%;
        background: var(--accent);
        border-radius: 3px;
        transition: width 0.3s;
      }
      .progress-label {
        font-size: 12px;
        color: var(--muted);
        margin-top: 4px;
      }

      .chevron {
        font-size: 18px;
        color: var(--muted);
        transition: transform 0.2s;
      }
      .chevron.open {
        transform: rotate(180deg);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Workout Tracker</h1>
      <p id="overall-progress">Loading progress...</p>
    </header>

    <div class="week-nav">
      <button class="week-arrow" id="week-prev" onclick="changeWeek(-1)">
        ‹
      </button>
      <div class="week-info">
        <div class="week-title" id="week-title">Week 4</div>
        <select
          class="week-select"
          id="week-select"
          onchange="jumpToWeek(this.value)"
        ></select>
      </div>
      <button class="week-arrow" id="week-next" onclick="changeWeek(1)">
        ›
      </button>
    </div>

    <div class="content" id="content"></div>

      function getPhaseForWeek(week) {
        return PHASES.find((p) => p.weeks.includes(week)) || PHASES[0];
      }

      const STORAGE_KEY = "workout_tracker_v2"; // kept from before — old weeks 1–3 logs stay intact, untouched
      const WEEK_POINTER_KEY = "workout_current_week"; // remembers which week you're on

      function loadData() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          return raw ? JSON.parse(raw) : {};
        } catch (e) {
          return {};
        }
      }
      function saveData(d) {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(d));
        } catch (e) {}
      }

      function loadCurrentWeek() {
        const saved = parseInt(localStorage.getItem(WEEK_POINTER_KEY), 10);
        if (!isNaN(saved) && saved >= WEEK_START && saved <= WEEK_END)
          return saved;
        return WEEK_START;
      }
      function saveCurrentWeek(w) {
        try {
          localStorage.setItem(WEEK_POINTER_KEY, String(w));
        } catch (e) {}
      }

      let data = loadData();
      let currentWeek = loadCurrentWeek();

      function compositeId(week, templateDayId) {
        return `w${week}_${templateDayId}`;
      }

      function parseComposite(id) {
        const [wPart, dayId] = id.split("_");
        return { week: parseInt(wPart.replace("w", ""), 10), dayId };
      }

      function getDayData(id) {
        return data[id] || { exercises: {}, finished: false, notes: "" };
      }

      function getTemplateDay(id) {
        const { week, dayId } = parseComposite(id);
        const phase = getPhaseForWeek(week);
        return phase.template.find((d) => d.id === dayId);
      }

      function getDayExercises(id) {
        const day = getTemplateDay(id);
        return day ? day.exercises || [] : [];
      }

      function allMarked(dd, exercises) {
        if (!dd || !dd.exercises) return false;
        return exercises.every((e) => dd.exercises[e.id]);
      }

      function getDayStatus(dd, exercises) {
        if (!dd || !dd.exercises) return "pending";
        if (dd.finished) return "done";
        const statuses = exercises
          .map((e) => dd.exercises[e.id])
          .filter(Boolean);
        if (statuses.length === 0) return "pending";
        if (statuses.every((s) => s === "green")) return "done";
        return "partial";
      }

      function setExerciseStatus(id, exId, status) {
        if (!data[id]) data[id] = { exercises: {}, finished: false, notes: "" };
        if (data[id].exercises[exId] === status) {
          delete data[id].exercises[exId];
        } else {
          data[id].exercises[exId] = status;
        }
        saveData(data);
        updateExerciseButtons(id, exId);
        updateFinishBtn(id);
        updateDayBadge(id);
        updateWeekProgress();
        updateOverallProgress();
      }

      function updateExerciseButtons(id, exId) {
        const current = data[id]?.exercises?.[exId];
        document
          .querySelectorAll(`[data-day="${id}"][data-ex="${exId}"]`)
          .forEach((btn) => {
            const s = btn.getAttribute("data-status");
            btn.classList.remove(
              "selected-green",
              "selected-yellow",
              "selected-red",
            );
            if (current === s) btn.classList.add("selected-" + s);
          });
      }

      function updateFinishBtn(id) {
        const dd = getDayData(id);
        if (dd.finished) return;
        const ready = allMarked(dd, getDayExercises(id));
        const btn = document.querySelector(`[data-finish="${id}"]`);
        if (!btn) return;
        btn.disabled = !ready;
        btn.textContent = ready ? "Finish day →" : "Mark all exercises first";
      }

      function updateDayBadge(id) {
        const dd = getDayData(id);
        const exercises = getDayExercises(id);
        const badge = document.querySelector(`[data-badge="${id}"]`);
        if (!badge) return;
        const statuses = exercises
          .map((e) => dd.exercises?.[e.id])
          .filter(Boolean);
        if (
          dd.finished ||
          (statuses.length && statuses.every((s) => s === "green"))
        ) {
          badge.textContent = "✓ Done";
          badge.className = "day-status status-done";
        } else if (statuses.length) {
          badge.textContent = "~ Partial";
          badge.className = "day-status status-partial";
        } else {
          badge.textContent = "Not started";
          badge.className = "day-status status-pending";
        }
      }

      function finishDayOnly(id) {
        if (!data[id]) data[id] = { exercises: {}, finished: false, notes: "" };
        data[id].finished = true;
        const notes = document.getElementById("notes-" + id);
        if (notes) data[id].notes = notes.value;
        saveData(data);
        updateWeekProgress();
        updateOverallProgress();
        const body = document.getElementById("body-" + id);
        if (!body) return;
        const btn = body.querySelector(`[data-finish="${id}"]`);
        if (btn) {
          btn.textContent = "✓ Day finished";
          btn.disabled = true;
        }
        const msg = body.querySelector(".completion-msg");
        if (msg) msg.classList.add("visible");
        const header = body.previousElementSibling;
        if (header) {
          const badge = header.querySelector(".day-status");
          if (badge) {
            badge.textContent = "✓ Done";
            badge.className = "day-status status-done";
          }
        }
      }

      function saveNotes(id, notes) {
        if (!data[id]) data[id] = { exercises: {}, finished: false, notes: "" };
        data[id].notes = notes;
        saveData(data);
      }

      function saveNotesBtn(id) {
        const notes = document.getElementById("notes-" + id);
        if (notes) saveNotes(id, notes.value);
        const btn = document.querySelector(`[data-savenotes="${id}"]`);
        if (!btn) return;
        const orig = btn.textContent;
        btn.textContent = "Saved ✓";
        setTimeout(() => (btn.textContent = orig), 1500);
      }

      function toggleDay(id) {
        const body = document.getElementById("body-" + id);
        const header = body.previousElementSibling;
        const chevron = header.querySelector(".chevron");
        const hidden = body.classList.toggle("hidden");
        header.classList.toggle("collapsed", hidden);
        chevron.classList.toggle("open", !hidden);
      }

      function updateWeekProgress() {
        const phase = getPhaseForWeek(currentWeek);
        const structured = phase.template.filter((d) => !d.rest && !d.optional);
        const done = structured.filter(
          (d) => getDayData(compositeId(currentWeek, d.id)).finished,
        ).length;
        const pct = structured.length
          ? Math.round((done / structured.length) * 100)
          : 0;
        const fill = document.getElementById("week-progress-fill");
        const label = document.getElementById("week-progress-label");
        if (fill) fill.style.width = pct + "%";
        if (label)
          label.textContent = `${done} of ${structured.length} required days done this week`;
      }

      function updateOverallProgress() {
        let total = 0,
          done = 0;
        for (let w = WEEK_START; w <= WEEK_END; w++) {
          const phase = getPhaseForWeek(w);
          phase.template.forEach((d) => {
            if (d.rest || d.optional) return;
            total++;
            if (getDayData(compositeId(w, d.id)).finished) done++;
          });
        }
        const pct = total ? Math.round((done / total) * 100) : 0;
        document.getElementById("overall-progress").textContent =
          `${done} of ${total} workout days complete across weeks ${WEEK_START}–${WEEK_END} · ${pct}%`;
      }

      function changeWeek(delta) {
        currentWeek = Math.min(
          WEEK_END,
          Math.max(WEEK_START, currentWeek + delta),
        );
        saveCurrentWeek(currentWeek);
        renderAll();
      }
      function jumpToWeek(val) {
        currentWeek = Math.min(
          WEEK_END,
          Math.max(WEEK_START, parseInt(val, 10)),
        );
        saveCurrentWeek(currentWeek);
        renderAll();
      }

      function renderWeekNav() {
        document.getElementById("week-title").textContent =
          `Week ${currentWeek}`;
        document.getElementById("week-prev").disabled =
          currentWeek <= WEEK_START;
        document.getElementById("week-next").disabled = currentWeek >= WEEK_END;
        const select = document.getElementById("week-select");
        select.innerHTML = "";
        for (let w = WEEK_START; w <= WEEK_END; w++) {
          const opt = document.createElement("option");
          opt.value = w;
          opt.textContent = `Jump to week ${w}`;
          if (w === currentWeek) opt.selected = true;
          select.appendChild(opt);
        }
      }

      function renderContent() {
        const phase = getPhaseForWeek(currentWeek);
        const content = document.getElementById("content");

        let html = `
    <div class="phase-header">
      <h2>${phase.label}</h2>
      <div class="progress-bar-wrap">
        <div class="progress-bar"><div class="progress-fill" id="week-progress-fill" style="width:0%"></div></div>
        <p class="progress-label" id="week-progress-label"></p>
      </div>
      <div class="phase-note">${phase.note}</div>
    </div>
  `;

        phase.template.forEach((day) => {
          const id = compositeId(currentWeek, day.id);

          if (day.rest) {
            html += `<div class="day-section"><div class="rest-day">${day.label} · ${day.name}</div></div>`;
            return;
          }

          const dd = getDayData(id);
          const status = getDayStatus(dd, day.exercises);
          const statusLabels = {
            done: "✓ Done",
            partial: "~ Partial",
            pending: "Not started",
          };
          const statusClasses = {
            done: "status-done",
            partial: "status-partial",
            pending: "status-pending",
          };
          const isOpen = !dd.finished;
          const ready = allMarked(dd, day.exercises);
          const savedNote = dd.notes || "";

          html += `<div class="day-section">
      <div class="day-header${isOpen ? "" : " collapsed"}" onclick="toggleDay('${id}')">
        <div>
          <span class="day-title">${day.label} · ${day.name}</span>
          ${day.optional ? '<span class="optional-tag">Optional</span>' : ""}
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <span class="day-status ${statusClasses[status]}" data-badge="${id}">${statusLabels[status]}</span>
          <span class="chevron${isOpen ? " open" : ""}">⌄</span>
        </div>
      </div>
      <div class="day-body${isOpen ? "" : " hidden"}" id="body-${id}">`;

          day.exercises.forEach((ex) => {
            const exStatus = dd.exercises?.[ex.id];
            html += `<div class="exercise-row">
        <div class="exercise-text">
          ${ex.name}
          ${ex.sub ? `<div class="exercise-sub">${ex.sub}</div>` : ""}
        </div>
        <div class="status-btns">
          <button class="status-btn${exStatus === "green" ? " selected-green" : ""}"
            data-day="${id}" data-ex="${ex.id}" data-status="green"
            onclick="setExerciseStatus('${id}','${ex.id}','green')" title="Completed">✓</button>
          <button class="status-btn${exStatus === "yellow" ? " selected-yellow" : ""}"
            data-day="${id}" data-ex="${ex.id}" data-status="yellow"
            onclick="setExerciseStatus('${id}','${ex.id}','yellow')" title="Partial">~</button>
          <button class="status-btn${exStatus === "red" ? " selected-red" : ""}"
            data-day="${id}" data-ex="${ex.id}" data-status="red"
            onclick="setExerciseStatus('${id}','${ex.id}','red')" title="Missed">✗</button>
        </div>
      </div>`;
          });

          html += `<div class="finish-section">
      <button class="finish-btn" data-finish="${id}"
        ${ready && !dd.finished ? "" : "disabled"}
        onclick="finishDayOnly('${id}')">
        ${dd.finished ? "✓ Day finished" : ready ? "Finish day →" : "Mark all exercises first"}
      </button>
      <p class="completion-msg${dd.finished ? " visible" : ""}">Day logged ✓</p>
      <textarea class="notes-area" id="notes-${id}"
        placeholder="How did it feel? Anything to note for next time..."
        onchange="saveNotes('${id}', this.value)">${savedNote}</textarea>
      <button class="save-notes-btn" data-savenotes="${id}" onclick="saveNotesBtn('${id}')">Save notes</button>
    </div>`;

          html += `</div></div>`;
        });

        content.innerHTML = html;
      }

      function renderAll() {
        renderWeekNav();
        renderContent();
        updateWeekProgress();
        updateOverallProgress();
      }

      renderAll();
    </script>
  </body>
</html>
