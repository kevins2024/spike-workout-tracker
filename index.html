<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4-Month Workout Plan</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f5f5f2;
    --card: #ffffff;
    --border: #e0ddd6;
    --text: #1a1a18;
    --muted: #888780;
    --accent: #2563eb;
    --accent-bg: #eff6ff;
    --green: #16a34a;
    --green-bg: #dcfce7;
    --yellow: #ca8a04;
    --yellow-bg: #fef9c3;
    --red: #dc2626;
    --red-bg: #fee2e2;
    --radius: 10px;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 0 0 80px;
  }

  header {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 16px 20px 12px;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header h1 { font-size: 18px; font-weight: 600; }
  header p { font-size: 13px; color: var(--muted); margin-top: 2px; }

  .phase-nav {
    display: flex;
    gap: 6px;
    padding: 12px 16px;
    overflow-x: auto;
    scrollbar-width: none;
    background: var(--card);
    border-bottom: 1px solid var(--border);
  }
  .phase-nav::-webkit-scrollbar { display: none; }

  .phase-btn {
    flex-shrink: 0;
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: transparent;
    font-size: 13px;
    color: var(--muted);
    cursor: pointer;
  }
  .phase-btn.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
    font-weight: 500;
  }

  .content { padding: 16px; max-width: 600px; margin: 0 auto; }

  .phase-header {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 12px;
  }
  .phase-header h2 { font-size: 16px; font-weight: 600; }
  .phase-header p { font-size: 13px; color: var(--muted); margin-top: 3px; }
  .phase-note {
    font-size: 13px;
    color: #1e40af;
    background: var(--accent-bg);
    border-radius: 6px;
    padding: 8px 10px;
    margin-top: 10px;
    line-height: 1.5;
  }

  .day-section { margin-bottom: 12px; }

  .day-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius) var(--radius) 0 0;
    padding: 12px 14px;
    cursor: pointer;
    user-select: none;
  }
  .day-header.collapsed { border-radius: var(--radius); }

  .day-title { font-size: 15px; font-weight: 600; }
  .day-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

  .day-status {
    font-size: 11px;
    font-weight: 500;
    padding: 3px 9px;
    border-radius: 20px;
    white-space: nowrap;
  }
  .status-done { background: var(--green-bg); color: var(--green); }
  .status-partial { background: var(--yellow-bg); color: var(--yellow); }
  .status-missed { background: var(--red-bg); color: var(--red); }
  .status-pending { background: var(--bg); color: var(--muted); border: 1px solid var(--border); }

  .day-body {
    background: var(--card);
    border: 1px solid var(--border);
    border-top: none;
    border-radius: 0 0 var(--radius) var(--radius);
    padding: 0 14px 14px;
  }
  .day-body.hidden { display: none; }

  .rest-day {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
    font-size: 13px;
    color: var(--muted);
    font-style: italic;
  }

  .exercise-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .exercise-row:last-of-type { border-bottom: none; }

  .exercise-text { flex: 1; font-size: 14px; line-height: 1.4; padding-top: 2px; }
  .exercise-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

  .status-btns { display: flex; gap: 5px; flex-shrink: 0; }

  .status-btn {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 2px solid var(--border);
    background: transparent;
    cursor: pointer;
    font-size: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.1s;
  }
  .status-btn:active { transform: scale(0.9); }
  .status-btn.selected-green { background: var(--green-bg); border-color: var(--green); }
  .status-btn.selected-yellow { background: var(--yellow-bg); border-color: var(--yellow); }
  .status-btn.selected-red { background: var(--red-bg); border-color: var(--red); }

  .finish-section {
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }

  .finish-btn {
    width: 100%;
    padding: 12px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  .finish-btn:disabled {
    background: var(--border);
    color: var(--muted);
    cursor: default;
  }
  .finish-btn:not(:disabled):active { opacity: 0.85; }

  .notes-area {
    width: 100%;
    margin-top: 10px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    font-size: 14px;
    font-family: inherit;
    resize: vertical;
    min-height: 80px;
    background: var(--bg);
    color: var(--text);
  }

  .save-notes-btn {
    margin-top: 8px;
    padding: 8px 16px;
    border: 1px solid var(--accent);
    background: transparent;
    color: var(--accent);
    border-radius: var(--radius);
    font-size: 14px;
    cursor: pointer;
  }
  .save-notes-btn:active { background: var(--accent-bg); }

  .completion-msg {
    font-size: 13px;
    color: var(--green);
    margin-top: 8px;
    font-weight: 500;
    display: none;
  }
  .completion-msg.visible { display: block; }

  .progress-bar-wrap { margin-top: 8px; }
  .progress-bar {
    height: 5px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
    margin-top: 6px;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 3px;
    transition: width 0.3s;
  }
  .progress-label { font-size: 12px; color: var(--muted); margin-top: 4px; }

  .chevron { font-size: 18px; color: var(--muted); transition: transform 0.2s; }
  .chevron.open { transform: rotate(180deg); }

  .tip-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin: 16px 0 6px;
  }
  .tip-box {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 13px;
    color: var(--muted);
    line-height: 1.6;
    margin-bottom: 4px;
  }
</style>
</head>

const STORAGE_KEY = 'workout_tracker_v2';

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch(e) { return {}; }
}

function saveData(data) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch(e) {}
}

let data = loadData();
let currentPhase = 0;

function getDayData(dayId) {
  return data[dayId] || { exercises: {}, finished: false, notes: '' };
}

function setExerciseStatus(dayId, exId, status) {
  if (!data[dayId]) data[dayId] = { exercises: {}, finished: false, notes: '' };
  if (data[dayId].exercises[exId] === status) {
    delete data[dayId].exercises[exId];
  } else {
    data[dayId].exercises[exId] = status;
  }
  saveData(data);
  // Update just the finish button state without full re-render
  updateFinishBtn(dayId);
  updateDayBadge(dayId);
  updateProgressBars();
  updateOverallProgress();
}

function allMarked(dayData, exercises) {
  if (!dayData || !dayData.exercises) return false;
  return exercises.every(e => dayData.exercises[e.id]);
}

function getDayExercises(dayId) {
  for (const phase of PLAN) {
    for (const day of phase.days) {
      if (day.id === dayId) return day.exercises || [];
    }
  }
  return [];
}

function updateFinishBtn(dayId) {
  const dd = getDayData(dayId);
  const exercises = getDayExercises(dayId);
  const ready = allMarked(dd, exercises);
  const btn = document.querySelector(`[data-finish="${dayId}"]`);
  if (!btn) return;
  if (dd.finished) return; // already finished, don't change
  btn.disabled = !ready;
  btn.textContent = ready ? 'Finish day →' : 'Mark all exercises first';
}

function updateDayBadge(dayId) {
  const dd = getDayData(dayId);
  const exercises = getDayExercises(dayId);
  const badge = document.querySelector(`[data-badge="${dayId}"]`);
  if (!badge) return;
  const statuses = exercises.map(e => dd.exercises?.[e.id]).filter(Boolean);
  if (statuses.length === 0) {
    badge.textContent = 'Not started';
    badge.className = 'day-status status-pending';
  } else if (statuses.every(s => s === 'green')) {
    badge.textContent = '✓ Done';
    badge.className = 'day-status status-done';
  } else if (statuses.includes('red')) {
    badge.textContent = '~ Partial';
    badge.className = 'day-status status-partial';
  } else {
    badge.textContent = '~ Partial';
    badge.className = 'day-status status-partial';
  }
}

function updateProgressBars() {
  PLAN.forEach((phase, i) => {
    const workDays = phase.days.filter(d => !d.rest);
    const finishedDays = workDays.filter(d => getDayData(d.id).finished).length;
    const pct = workDays.length > 0 ? Math.round((finishedDays / workDays.length) * 100) : 0;
    const fill = document.querySelector(`[data-phase-fill="${phase.id}"]`);
    const label = document.querySelector(`[data-phase-label="${phase.id}"]`);
    if (fill) fill.style.width = pct + '%';
    if (label) label.textContent = `${finishedDays} of ${workDays.length} days done`;
  });
}

function updateOverallProgress() {
  let total = 0, done = 0;
  PLAN.forEach(phase => {
    phase.days.forEach(day => {
      if (day.rest) return;
      total++;
      if (getDayData(day.id).finished) done++;
    });
  });
  const pct = total > 0 ? Math.round((done / total) * 100) : 0;
  document.getElementById('overall-progress').textContent =
    `${done} of ${total} workout days complete · ${pct}%`;
}

function finishDayOnly(dayId) {
  if (!data[dayId]) data[dayId] = { exercises: {}, finished: false, notes: '' };
  data[dayId].finished = true;
  const notes = document.getElementById('notes-' + dayId);
  if (notes) data[dayId].notes = notes.value;
  saveData(data);
  updateOverallProgress();
  updateProgressBars();
  const body = document.getElementById('body-' + dayId);
  if (!body) return;
  const btn = body.querySelector(`[data-finish="${dayId}"]`);
  if (btn) { btn.textContent = '✓ Day finished'; btn.disabled = true; }
  const msg = body.querySelector('.completion-msg');
  if (msg) msg.classList.add('visible');
  const header = body.previousElementSibling;
  if (header) {
    const badge = header.querySelector('.day-status');
    if (badge) { badge.textContent = '✓ Done'; badge.className = 'day-status status-done'; }
  }
}

function saveNotes(dayId, notes) {
  if (!data[dayId]) data[dayId] = { exercises: {}, finished: false, notes: '' };
  data[dayId].notes = notes;
  saveData(data);
}

function saveNotesBtn(dayId) {
  const notes = document.getElementById('notes-' + dayId);
  if (notes) saveNotes(dayId, notes.value);
  const btn = document.querySelector(`[data-savenotes="${dayId}"]`);
  if (!btn) return;
  const orig = btn.textContent;
  btn.textContent = 'Saved ✓';
  setTimeout(() => btn.textContent = orig, 1500);
}

function getDayStatus(dd, exercises) {
  if (!dd || !dd.exercises) return 'pending';
  if (dd.finished) return 'done';
  const statuses = exercises.map(e => dd.exercises[e.id]).filter(Boolean);
  if (statuses.length === 0) return 'pending';
  if (statuses.every(s => s === 'green')) return 'done';
  if (statuses.includes('red')) return 'partial';
  return 'partial';
}

function renderPhaseNav() {
  const nav = document.getElementById('phase-nav');
  nav.innerHTML = PLAN.map((p, i) =>
    `<button class="phase-btn${i === currentPhase ? ' active' : ''}" onclick="switchPhase(${i})">${p.label}</button>`
  ).join('');
}

function switchPhase(i) {
  currentPhase = i;
  renderPhaseNav();
  renderContent();
}

function toggleDay(dayId) {
  const body = document.getElementById('body-' + dayId);
  const header = body.previousElementSibling;
  const chevron = header.querySelector('.chevron');
  if (body.classList.contains('hidden')) {
    body.classList.remove('hidden');
    header.classList.remove('collapsed');
    chevron.classList.add('open');
  } else {
    body.classList.add('hidden');
    header.classList.add('collapsed');
    chevron.classList.remove('open');
  }
}

function renderContent() {
  const phase = PLAN[currentPhase];
  const content = document.getElementById('content');

  const workDays = phase.days.filter(d => !d.rest);
  const finishedDays = workDays.filter(d => getDayData(d.id).finished).length;
  const phasePct = workDays.length > 0 ? Math.round((finishedDays / workDays.length) * 100) : 0;

  let html = `
    <div class="phase-header">
      <h2>${phase.title}</h2>
      <p>${phase.sub}</p>
      <div class="progress-bar-wrap">
        <div class="progress-bar"><div class="progress-fill" data-phase-fill="${phase.id}" style="width:${phasePct}%"></div></div>
        <p class="progress-label" data-phase-label="${phase.id}">${finishedDays} of ${workDays.length} days done</p>
      </div>
      <div class="phase-note">${phase.note}</div>
    </div>
  `;

  phase.days.forEach(day => {
    if (day.rest) {
      html += `<div class="day-section"><div class="rest-day">${day.label} · ${day.name}</div></div>`;
      return;
    }

    const dd = getDayData(day.id);
    const status = getDayStatus(dd, day.exercises);
    const statusLabels = { done: '✓ Done', partial: '~ Partial', missed: '✗ Missed', pending: 'Not started' };
    const statusClasses = { done: 'status-done', partial: 'status-partial', missed: 'status-missed', pending: 'status-pending' };
    const isOpen = !dd.finished;
    const ready = allMarked(dd, day.exercises);
    const savedNote = dd.notes || '';

    html += `<div class="day-section">
      <div class="day-header${isOpen ? '' : ' collapsed'}" onclick="toggleDay('${day.id}')">
        <div>
          <div class="day-title">${day.label} · ${day.name}</div>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <span class="day-status ${statusClasses[status]}" data-badge="${day.id}">${statusLabels[status]}</span>
          <span class="chevron${isOpen ? ' open' : ''}">⌄</span>
        </div>
      </div>
      <div class="day-body${isOpen ? '' : ' hidden'}" id="body-${day.id}">`;

    day.exercises.forEach(ex => {
      const exStatus = dd.exercises?.[ex.id];
      html += `<div class="exercise-row">
        <div class="exercise-text">
          ${ex.name}
          ${ex.sub ? `<div class="exercise-sub">${ex.sub}</div>` : ''}
        </div>
        <div class="status-btns">
          <button class="status-btn${exStatus === 'green' ? ' selected-green' : ''}"
            onclick="setExerciseStatus('${day.id}','${ex.id}','green')" title="Completed">✓</button>
          <button class="status-btn${exStatus === 'yellow' ? ' selected-yellow' : ''}"
            onclick="setExerciseStatus('${day.id}','${ex.id}','yellow')" title="Partial">~</button>
          <button class="status-btn${exStatus === 'red' ? ' selected-red' : ''}"
            onclick="setExerciseStatus('${day.id}','${ex.id}','red')" title="Missed">✗</button>
        </div>
      </div>`;
    });

    html += `<div class="finish-section">
      <button class="finish-btn" data-finish="${day.id}"
        ${ready && !dd.finished ? '' : 'disabled'}
        onclick="finishDayOnly('${day.id}')">
        ${dd.finished ? '✓ Day finished' : ready ? 'Finish day →' : 'Mark all exercises first'}
      </button>
      <p class="completion-msg${dd.finished ? ' visible' : ''}">Day logged ✓</p>
      <textarea class="notes-area"
        id="notes-${day.id}"
        placeholder="How did it feel? Anything to note for next time..."
        onchange="saveNotes('${day.id}', this.value)">${savedNote}</textarea>
      <button class="save-notes-btn" data-savenotes="${day.id}" onclick="saveNotesBtn('${day.id}')">Save notes</button>
    </div>`;

    html += `</div></div>`;
  });

  content.innerHTML = html;
}

renderPhaseNav();
renderContent();
updateOverallProgress();
</script>
</body>
</html>
